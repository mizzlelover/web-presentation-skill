<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实验 · Three.js 正反用例（补丁 §13/§20）</title>
<style>
  :root{ --bg:#fff; --fg:#111; --muted:#666; --line:#e3e3e3; --accent:#2f6df6; --warn:#c2410c }
  *{box-sizing:border-box}
  body{margin:0;padding:28px;background:var(--bg);color:var(--fg);font:14px/1.7 system-ui,"PingFang SC",sans-serif}
  h1{font-size:20px;margin:0 0 6px}
  p.lead{color:var(--muted);margin:0 0 20px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .card{border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h2{font-size:15px;margin:0 0 4px}
  .tag{display:inline-block;font-size:11px;border-radius:999px;padding:2px 10px;margin-bottom:10px}
  .tag.pos{background:#e7f5ec;color:#166534}
  .tag.neg{background:#fdece4;color:var(--warn)}
  .cv{width:100%;height:260px;border:1px solid var(--line);border-radius:8px;background:#fafafa;display:block}
  .metric{font-size:12px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
  .lbl{font-size:12px;fill:#666}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>实验 · Three.js 正反用例（补丁 §13）</h1>
<p class="lead">同一批内容，分别用 3D 与 2D 表达，用于判断「什么时候 3D 真的有认知价值」，而不是证明 Three.js 很酷。</p>

<div class="grid">
  <div class="card">
    <h2>正向：场馆空间关系</h2>
    <span class="tag pos">3D 合理</span>
    <canvas class="cv" id="pos"></canvas>
    <div class="metric" id="pos-metric">加载中…</div>
    <div class="metric">内容本质是「三个空间体块的位置与开口关系」——投影到 2D 会丢失遮挡关系。</div>
  </div>

  <div class="card">
    <h2>反向：同一内容的 2D 表达</h2>
    <span class="tag neg">2D 更优</span>
    <svg class="cv" id="neg" viewBox="0 0 420 260" preserveAspectRatio="xMidYMid meet" role="img" aria-label="三层结构与开口关系的 2D 表达">
      <rect x="20" y="30" width="120" height="80" rx="6" fill="#e8eefc" stroke="#2f6df6"/>
      <text class="lbl" x="30" y="55">主厅</text><text class="lbl" x="30" y="74">开口 → 东</text>
      <rect x="160" y="30" width="120" height="80" rx="6" fill="#eef7f0" stroke="#16a34a"/>
      <text class="lbl" x="170" y="55">侧厅</text><text class="lbl" x="170" y="74">开口 → 主厅</text>
      <rect x="90" y="140" width="120" height="80" rx="6" fill="#fdf3e7" stroke="#c2410c"/>
      <text class="lbl" x="100" y="165">服务区</text><text class="lbl" x="100" y="184">开口 → 主厅</text>
      <line x1="140" y1="70" x2="160" y2="70" stroke="#666" stroke-width="1.5"/>
      <line x1="150" y1="110" x2="150" y2="140" stroke="#666" stroke-width="1.5"/>
      <text class="lbl" x="20" y="245">同样的体块与开口关系，用 2D 表达更快读、更易标注、可打印</text>
    </svg>
    <div class="metric">同内容 2D 表达：0 依赖、0 渲染开销、可打印、可无障碍标注。</div>
  </div>
</div>

<div class="metric" style="margin-top:18px">
  测量（本机）· Three.js 加载：<b id="m-load">—</b> ·
  首帧：<b id="m-first">—</b> · 1 秒帧数：<b id="m-fps">—</b> · 射线交互：<b id="m-ray">—</b>
</div>

<script src="../vendor/three.min.js"></script>
<script>
window.THREE_BENCH = { available: typeof THREE !== "undefined" };
(function () {
  if (typeof THREE === "undefined") {
    document.getElementById("pos-metric").textContent = "Three.js 未加载";
    return;
  }
  var t0 = performance.now();
  THREE_BENCH.loadMs = Math.round(t0 - (window.__navStart || 0));

  var canvas = document.getElementById("pos");
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0xfafafa);
  var camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 100);
  camera.position.set(6, 5, 8);
  camera.lookAt(0, 0, 0);

  scene.add(new THREE.AmbientLight(0xffffff, .75));
  var dir = new THREE.DirectionalLight(0xffffff, .7);
  dir.position.set(5, 8, 6);
  scene.add(dir);

  // 三个体块：主厅 / 侧厅 / 服务区（与 2D 图同内容）
  function box(w, h, d, x, z, color) {
    var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: color, roughness: .6, metalness: .05 }));
    m.position.set(x, h / 2, z);
    scene.add(m);
    var e = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({ color: 0x334155 }));
    e.position.copy(m.position);
    scene.add(e);
    return m;
  }
  var meshes = [box(3, 2, 3, -2, 0, 0x9db8ff), box(3, 2, 3, 2, 0, 0xb7e6c4), box(3, 2, 3, 0, 3, 0xffd9b8)];
  scene.add(new THREE.GridHelper(14, 14, 0xdddddd, 0xeeeeee));

  var raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
  canvas.addEventListener("pointermove", function (e) {
    var r = canvas.getBoundingClientRect();
    pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
    pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  });

  var frames = 0, fpsStart = performance.now(), first = null;
  function loop() {
    requestAnimationFrame(loop);
    if (first === null) { first = performance.now(); document.getElementById("m-first").textContent = Math.round(first - t0) + "ms"; THREE_BENCH.firstFrameMs = Math.round(first - t0); }
    raycaster.setFromCamera(pointer, camera);
    var hit = raycaster.intersectObjects(meshes)[0];
    meshes.forEach(function (m) { m.material.opacity = 1; m.material.transparent = false; });
    if (hit) { hit.object.material.transparent = true; hit.object.material.opacity = .55; }
    document.getElementById("m-ray").textContent = hit ? "命中" : "未命中";
    renderer.render(scene, camera);
    frames++;
    if (frames % 60 === 0) {
      var fps = Math.round((frames / (performance.now() - fpsStart)) * 1000);
      document.getElementById("m-fps").textContent = fps + " fps";
      document.getElementById("m-fps").dataset.v = fps;
      THREE_BENCH.fps = fps;
    }
  }
  loop();
  document.getElementById("m-load").textContent = (THREE_BENCH.loadMs || 0) + "ms（脚本解析至可用）";
  document.getElementById("pos-metric").textContent = "Three.js r149 · WebGL" + (renderer.capabilities.isWebGL2 ? "2" : "1");
})();
window.addEventListener("load", function () { window.THREE_BENCH.loadedAt = Math.round(performance.now()); });
</script>
</body>
</html>
