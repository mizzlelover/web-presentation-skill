# Web Capability Registry Schema — Web 能力登记（§77）
capability: str          # 如 View Transition API
purpose: str
technology: str          # CSS / Web Animations API / ECharts / Three.js ...
browser_support:
  chromium: str          # 版本或 no
  safari: str
  firefox: str
performance_cost: enum   # low | medium | high
