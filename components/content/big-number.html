<!-- BigNumber — Cognitive Job: Quantify
     规则：一幕一个大数字；必须带单位、时间与来源；数字必须能被证据支撑。 -->
<section class="wp-scene wp-bignum">
  <h2 class="wp-bignum__context">{{WHAT_THIS_NUMBER_MEANS}}</h2>
  <p class="wp-big-number">{{NUMBER}}<small>{{UNIT}}</small></p>
  <p data-reveal>{{ONE_SENTENCE_SO_WHAT}}</p>
  <p class="wp-source">{{SOURCE}} · {{TIME}} · {{SCOPE}}</p>
  <aside class="wp-notes">{{SPEAKER_NOTES}}</aside>
  <div class="wp-reader">{{FULL_READER_CONTENT}}</div>
</section>
