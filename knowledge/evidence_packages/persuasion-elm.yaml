# Evidence Package · Elaboration Likelihood Model（补丁 §6 强制格式）
# 生成：2026-09-08，基于 SRC-PETTY-1984 作者官网扫描件六页逐页精读
id: EP-PERSUASION-ELM
domain: persuasion
mechanism: >
  说服沿"精细加工似然"连续体发生：动机（个人相关性、认知需求）×能力（时间、先备知识、
  无干扰）双高时走中心路径——态度由论证质量决定，所得态度持久、抗反驳、能预测行为；
  任一端低时走外围路径——态度由简单线索（来源专业度/吸引性/名人）决定。
  关键的非直觉机制：同一变量在不同涉入水平扮演不同角色——低涉入时来源是"简单线索"，
  中等涉入时来源决定"要不要认真想"（加工量的调节器），极高涉入时来源可成为论证本身
  （如美容产品的吸引性来源=视觉证词）。
primary_sources: [SRC-PETTY-1984]
supporting_evidence:
  - "Petty, Cacioppo & Goldman 1981：高个人相关→论证质量大幅影响态度、来源专业度作为线索无效；低相关→来源专业度不论论证强弱均提升同意"
  - "Petty, Cacioppo & Schumann 1983：名人 vs 普通市民广告，低涉入时名人更有效；高涉入时仅论证强度影响态度"
  - "Puckett et al. 1983：中等涉入下，吸引性来源增强对强论证的同意、降低对弱论证的同意（来源调节加工量/偏向加工）"
  - "Heesacker, Petty & Cacioppo 1983：场依存者受来源专业度影响更大；强论证配专家更有效、弱论证配专家反而更差"
  - "Hovland & Weiss 1951 重析：可信度效应在低个人相关主题上强、高相关主题上弱"
  - "Kiesler & Mathog 1968：高干扰（低能力）下来源可信度效应更大"
conflicting_evidence:
  - "ELM 非二元开关：两条路径是连续体的端点，同一变量多重角色——任何'受众分类军规'都过度简化"
experimental_context: >
  1970s–80s 社会心理学实验室实验：大学生被试、态度议题（综合考试、学费、消费品广告），
  操纵个人相关性/涉入度 × 来源因素 × 论证质量；因变量为态度同意度。
boundary_conditions:
  - "态度结论≠行为结论：中心路径态度'更能预测行为'是命题，本综述内未直接测行为"
  - "实验议题为消费与校园政策；高风险决策（投资/医疗/组织变革）的外推需补充证据"
  - "'名人/权威有效'仅在受众低动机或低能力时成立——对高涉入专业受众，论证质量是唯一杠杆"
effect_strength: "交互效应（涉入度 × 论证质量、涉入度 × 来源线索）在多个独立实验中方向一致重复出现；原文未报告标准化效应量（1984 年报告惯例）"
common_misinterpretation:
  - "❌'中心路径好、外围路径low'——外围线索是合法且必要的：受众首先用它决定要不要投入加工"
  - "❌'权威背书总是加分'——高涉入受众只认证据；弱论证配权威反而更糟（Heesacker 1983）"
  - "❌'ELM 把受众分两类'——原文明确是连续体与同一变量的多重角色"
presentation_application: >
  演示设计先评估受众涉入度（动机×能力）：高涉入专业受众——所有资源投入论证质量与证据链
  （evidence_scene 深潜页就是他们要的）；低涉入/非专业受众——来源可信度、叙事流畅性、
  视觉专业性（外围线索）决定他们是否愿意进入加工；中等涉入——用来源与 framing 引导
  "这值得你认真想"，随后论证质量必须接得住。演讲者专业形象（IP/资历）的定位由此确定：
  它是开场的外围线索与加工动机触发器，不是论证替代品。
confidence: medium   # 原始实验全文验证（一篇综述性原文）；1986 专著与 Kitchen et al. 2014 三十年回顾待真实获取
last_reviewed: 2026-09-08
