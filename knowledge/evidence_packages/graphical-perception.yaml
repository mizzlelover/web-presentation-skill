# Evidence Package · Graphical Perception（补丁 §6 强制格式）
# 生成：2026-09-08，基于 SRC-CLEVELAND-1986 全文精读（10 页，Int. J. Man-Machine Studies）
id: EP-GRAPHICAL-PERCEPTION
domain: data_visualization_cognition
mechanism: >
  读图 = 视觉系统对图形编码的解码过程。不同基本知觉判断（elementary perceptual tasks）
  的解码精度存在稳定的系统差异：位置与长度的判断依托对共同尺度的对齐比较，精度最高；
  角度/斜率需要方向估计，次之；面积需二维组合估计，最不准。
  图表类型选择本质上是在选择"受众被迫使用哪种知觉判断"——选低精度编码=直接把误差
  注入受众的解码链路。
primary_sources: [SRC-CLEVELAND-1986]
supporting_evidence:
  - "精度排序（实验实测）：位置（共同尺度）> 位置（非对齐同尺度）> 长度 > 角度≈斜率 > 面积（圆与不规则块）"
  - "N=127（24 高中生/60 大学生/43 技术训练专业人员），每人 210 次判断（7 类 × 2 标准 × 15 真值 17.5%–87.5%）"
  - "被判断对象间距增大 → 误差上升（邻近性影响精度）"
  - "技术训练程度不影响判断精度（三组箱线图分布相似）——排序是知觉系统属性，非专业技能"
conflicting_evidence:
  - "Bateman 2010（SRC-BATEMAN-2010，仍 memory_based）：视觉修饰不损害理解且提升记忆——精度不是图表唯一目标"
  - "极端真值（接近 0%/100%）判断误差天然极小，排序差异在区间中部才显著"
experimental_context: >
  实验室心理物理范式：孤立几何刺激（非真实图表语境），纸质呈现，判断"相对标准的百分比"。
  三个实验系列：基本判断排序（Exp 1/3）、分隔条形图中的长度 vs 位置（Exp 2）。
boundary_conditions:
  - "斜率判断结论仅对远离 0°/90° 的线段成立（接近时判断能力退化）"
  - "角度判断避开了 90°/180° 特殊角（这些角可被高精度识别）"
  - "刺激为孤立几何图形；真实图表含标注/语境/任务差异，外推需结合任务类型（后续 Heer & Bostock 2010 众包复现确认排序总体稳健——该文待真实获取）"
  - "排序针对'数值估计'任务；模式识别/趋势感知等高层任务未必同序"
effect_strength: "排序效应为大且稳定的方向性结论（对数平均误差的系统性差异）；未报告标准化效应量（1986 年报告惯例）"
common_misinterpretation:
  - "'饼图永远禁止'——原文结论是面积/角度判断精度低，应优先位置/长度编码；占比极值或构成简单的饼图并非必然错误"
  - "'排序=图表美学排名'——它只针对定量解码精度，不涉及记忆度/情感/品牌目标"
  - "'专家能克服差编码'——技术训练不影响精度，差编码对专家同样是差的"
presentation_application: >
  承载关键数值比较的图表优先使用共同尺度位置编码（条形图/点图），避免让受众依赖面积
  （气泡/矩形树图）或角度（饼图/环形图）做精确比较；需要比较的系列必须邻近放置
  （间距增大误差上升）；3D 图表强制引入体积/透视判断=精度最差档，禁止用于承载结论的数据。
confidence: medium   # 单篇配套实验全文验证；1984 原始 JASA 与 Heer & Bostock 2010 复现待真实获取后升级
last_reviewed: 2026-09-08
