# Evidence Package · Working Memory Limits（补丁 §6 强制格式）
# 生成：2026-09-08，基于 SRC-COWAN-2010 全文精读（PMC 开放全文）
id: EP-WORKING-MEMORY
domain: working_memory
mechanism: >
  存在一个跨材料、跨任务恒定的中央存储成分，上限 3–5 个有意义组块（青年成人）。
  更高的表观容量（如 Miller 7±2）依赖复述、分组、感觉记忆等辅助机制；
  当这些策略被抑制（快速同时呈现、不可预测结束的 running span、发音抑制、
  感觉记忆掩蔽），上限稳定在约 3–5。感觉记忆完整时双通道（视+听）优于单通道；
  掩蔽感觉记忆后，跨通道总容量仍约 4 项（Saults & Cowan 2007）——
  为 modality effect 提供了中央容量层面的边界解释。
primary_sources: [SRC-COWAN-2010]
supporting_evidence:
  - "Chen & Cowan：抑制复述后，无论单字还是学习过的词对，回忆均约 3 组块"
  - "Saults & Cowan 2007：掩蔽感觉记忆后，视觉阵列、听觉数字或两者混合的总容量均约 4 项"
  - "发展数据：7 岁约 1.5 项 → 成人约 3 项；注意聚焦能力在同期间保持稳定（Cowan et al. in press）"
  - "数学模型自由参数在多类问题求解模型中收敛于约 4（Halford, Cowan & Andrews 2007 引述）"
conflicting_evidence:
  - "Miller 7±2 与 3–5 的表面矛盾：前者含复述/组块化策略，后者是策略被控制后的中央上限——不是冲突而是测量条件不同"
  - "个体差异的两种解释并存：存储容量差异 vs 注意控制差异（Kane et al. 2001），证据支持两者均有独立贡献"
experimental_context: >
  认知实验范式：running span、同时阵列、发音抑制、视听双通道+掩蔽；
  被试覆盖儿童（7–8、11–12 岁）与成人；材料为字词、词对、色块、数字。
boundary_conditions:
  - "3–5 上限针对'有意义组块'——组块大小取决于受众先备知识（专家一块顶新手多块）"
  - "允许复述/分组/做笔记时表观容量上升——Reader Mode 受众可回看，限制宽松于现场"
  - "感觉记忆完整时双通道有优势；仅看中央容量时通道不叠加"
  - "上限成因未明（弱点派 vs 优势派），禁止给出生理机制式断言"
effect_strength: "恒定上限的方向性结论为领域共识级；具体数值随测量条件在 3–5 间变动；无单一效应量"
common_misinterpretation:
  - "❌'每页 7±2 条要点'——7±2 是含策略的表观数字且针对无关记忆任务；中央上限 3–5 组块才是设计约束"
  - "❌ 把组块数当成字数/条数——一个整合良好的图表+断言可以是一个组块"
  - "❌'双通道翻倍容量'——掩蔽实验显示中央容量不随通道数翻倍"
presentation_application: >
  每幕同时需要受众保持的"活跃概念"预算 ≤3–5 组块；超过则必须先组块化（先建图式再展开）。
  现场演示（不可回看、感觉记忆瞬时）比 Reader Mode 更受该上限约束——Stage Mode 的幕间
  分段与断言收口是在帮受众完成组块化。双通道（口播+视觉）的获益发生在感觉记忆层面，
  不解除中央容量上限——仍须控制每幕概念数。
confidence: high
last_reviewed: 2026-09-08
