# Evidence Package · Temporal Contiguity 时间临近（补丁 §6 强制格式）
# 生成：2026-09-08，基于 SRC-LIU-2022-TEMPORAL 全文精读（PMC 开放全文）+ SRC-GINNS-2006 摘要级
id: EP-TEMPORAL-CONTIGUITY
domain: temporal_contiguity
mechanism: >
  时间临近效应：语言（口播/旁白）与对应视觉信息在时间上协同呈现优于先后分离呈现。
  机制链（CLT/CTML/双重编码）：先后呈现迫使学习者在工作记忆中保持口播内容，
  同时执行视觉搜索-匹配，消耗本应用于意义建构的认知资源（temporal split-attention）。
  Liu 2022 的关键细化：在"视觉静态 + 口播动态"的幻灯片形态中，效应是否出现取决于
  并发的粒度——整体并发（全部视觉一次出齐+口播）仍有搜索-匹配负担，不触发效应；
  只有关键点随口播逐条揭示（高粒度同步）才触发效应。逐条揭示同时承担 cueing/signaling
  的注意引导功能，且已揭示要点驻留屏幕，缓冲口播的瞬时性。
primary_sources: [SRC-LIU-2022-TEMPORAL]
secondary_sources: [SRC-GINNS-2006]   # 摘要级：50 研究元分析支持主假设，材料复杂度为调节变量
supporting_evidence:
  - "CPK（逐条同步揭示）vs SP（先口播后出图）：后测 d=.51 (p=.03)；学习效率 d=2.73 (p<.001)"
  - "CPK vs CPW（整体并发）：后测 d=.67 (p=.01)；学习效率 d=.68 (p=.01)——同步粒度本身有独立贡献"
  - "CPW vs SP：后测不显著；仅学习效率 d=1.87 (p<.001)——整体并发不足以触发理解优势"
  - "组间总效应：后测 F(2,93)=3.42, p=.037, ηp²=.07；学习效率 F(2,93)=61.37, p<.001, ηp²=.57"
  - "SRC-GINNS-2006（摘要级）：50 项独立研究支持空间/时间临近主效应，复杂材料收益更大"
conflicting_evidence:
  - "认知负荷自评三组无显著差异——作者自陈测量稀释（27 页中仅 10 页处理页，整体评分掩盖处理效应）"
  - "SP 组词数更多（886 vs 800 词）、时长更长，时间差本身可能贡献学习效率差异的一部分"
experimental_context: >
  N=99（剔除离群后 96：CPK 31 / CPW 33 / SP 32）台湾本科生，简体中文语境近似的
  普通话"正念"主题材料，27 页 PowerPoint 幻灯片（10 页处理页），CPK/CPW 7 分 19 秒、
  SP 9 分 04 秒；后测 31 题（KR-20=.91），含 9 道脑结构匹配题与 22 道选择题；
  心智努力用 Paas 9 点量表；学习效率 = (z(后测) − z(时间))/√2。
boundary_conditions:
  - "已验证范围：录播幻灯片（narrated slideshow）、教学材料、大学生受众、中文内容"
  - "现场演示（讲者控制节奏）与录播不同：讲者可自适应调整，逐条揭示的收益逻辑仍适用但无直接实验"
  - "材料为中等复杂度概念性内容；对极简材料（一眼看完的图）逐条揭示收益可能消失"
  - "性别不均（75 女/24 男），作者提示需复核"
effect_strength: >
  理解后测中小效应（d=.51–.67），学习效率大效应（d=.68–2.73，含时间因素放大）。
  单一实验，Ginns 2006 元分析为摘要级旁证；按补丁标准置信度标 medium。
common_misinterpretation:
  - "'图和口播同时出现就够了'——错：整体并发（CPW）不触发效应，必须关键点粒度同步"
  - "'逐条揭示只是花哨动效'——它是降低视觉搜索-匹配负荷的认知设计，不是装饰"
  - "'先讲后看图也行'——SP 的学习效率显著最低（d=-1.07 vs CPK .76）"
presentation_application: >
  直接支持 Skill 的渐进揭示（progressive reveal）规范：讲者口播到哪个要点，哪个要点出现
  （waa-press 的 enter 动效与 Speaker Notes 锚点同步）；禁止"整页元素一次出齐再逐条讲"。
  静帧开关（M 键）面向的是"时间紧/受众熟悉"的例外场景，默认开启逐条同步揭示有实验支持。
  深潜页返回主线时，口播与视觉的同步由演讲者自行恢复——需在 Speaker Notes 标注"回到哪一句"。
confidence: medium   # 单一实验全文验证 + 元分析摘要级旁证
last_reviewed: 2026-09-08
