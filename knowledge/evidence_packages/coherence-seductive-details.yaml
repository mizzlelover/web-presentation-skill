# Evidence Package · Coherence / Seductive Details 一致性与诱惑细节（补丁 §6 强制格式）
# 生成：2026-09-08，基于 SRC-SUNDARARAJAN-2020 全文精读（Springer 官方 PDF）
id: EP-COHERENCE-SEDUCTIVE
domain: coherence_information_density
mechanism: >
  诱惑性细节 = 有趣但与学习目标无关的信息。机制链：细节捕获注意（认知兴趣）→
  工作记忆资源被分流到无关内容 → 干扰连贯心理模型的建构（读者试图把无关细节
  与核心内容强行建立连接）。静态细节持续可见，反复邀请这种错误连接；
  可回退媒介（纸质/可暂停文档）放大了这种反复干扰。删除无关信息 = coherence/weeding，
  是 CLT 外在负荷管理的直接应用。
primary_sources: [SRC-SUNDARARAJAN-2020]
supporting_evidence:
  - "总体效应 g=-0.33（58 文/68 效应量/N=7521，95%CI [-0.48,-0.18]）——中等负效应"
  - "回忆 g=-0.37（k=19）；回忆+迁移混合 g=-0.41（k=43）"
  - "纸质材料 g=-0.61 vs 数字材料 g=-0.27——媒介是显著调节变量"
  - "允许回退/回读时 g=-0.70（中到大）——可反复回看放大损害"
  - "无先验经验者 g=-0.52 vs 有经验者 g=-0.24——新手受害最深"
  - "中文学习材料 g=-0.75（大效应）vs 英语 -0.38 / 韩语 -0.52"
  - "静态诱惑细节 g=-0.43 显著；动态诱惑细节不显著（瞬时性反而降低损害）"
conflicting_evidence:
  - "数学与统计材料中诱惑细节呈显著正效应 g=+0.42——学科边界例外"
  - "纯迁移结局总体不显著——损害集中在内容回忆，不必然伤及迁移"
  - "对照材料用照片时效应反转（g=0.53, k=4，研究数少）"
experimental_context: >
  随机效应元分析；结局含回忆测验/迁移测验/混合；调节变量覆盖细节特征（格式/时机/频率）、
  材料设计（媒介/语言/学科/回退/学习目标呈现）与方法学（测量方式/操纵检验）三类。
boundary_conditions:
  - "数学/统计内容是已验证的正向例外——勿把'删一切有趣内容'推广到数学推导"
  - "高异质性 I²=89.35%：平均效应不能替代情境判断"
  - "先验知识高的受众受害小——专家受众的材料可容忍更多补充性细节"
  - "动态（瞬时呈现）的无关元素未显显著损害——但注意线索域证据（SRC-DEKONING-2009）显示运动捕获注意，两域结论的张力如实标注"
effect_strength: "总体中效应 g=-0.33；边界条件下可升至大效应（纸质 -0.61 / 可回退 -0.70 / 中文材料 -0.75）"
common_misinterpretation:
  - "'一致性原则=页面必须素'——它针对的是'有趣但无关'，不是'一切美观元素'；情感设计（emotional design）是另一个变量"
  - "'装饰图片无害'——装饰图片研究（Schneider et al. 2016 等）与诱惑细节结论不完全一致，按具体材料判断"
  - "'迁移没事所以无所谓'——回忆受损本身是演示失败（受众离场后什么都记不住）"
presentation_application: >
  每幕元素审查问句：'这个元素服务本幕 Cognitive Job 吗？'不服务就删（weeding）。
  Reader Mode（静态、可回退、文档形态）是诱惑细节损害最大的叠加形态——自读文档的
  装饰纪律必须严于 Stage Mode；中文材料效应最大（-0.75），中文演示每幕的装饰审查是
  高优先级检查项；面向新手受众的演示更需严格 weeding；与 KN-PRES 信息密度节点联动：
  密度上限的约束不仅是数量，更是'无关性'。
confidence: high   # 元分析全文验证，调节结构完整，跨语种跨媒介一致负效应
last_reviewed: 2026-09-08
