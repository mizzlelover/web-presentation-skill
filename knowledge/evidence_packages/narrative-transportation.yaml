# Evidence Package · Narrative Transportation 叙事传输（补丁 §6 强制格式）
# 生成：2026-09-08，基于 SRC-VANLAER-2014 全文精读（City Research Online 机构库接受版，78 页）
id: EP-NARRATIVE-TRANSPORTATION
domain: narrative_persuasion
mechanism: >
  叙事传输 = 受众心智进入故事所唤起的世界（transportation），返回时被旅程改变。
  机制链：可识别角色 + 可想象情节 + 逼真性（叙事者侧）激活意象加工；
  受众的熟悉度/注意/可传输性决定进入深度；传输状态下注意力被叙事占据，
  用于反驳/批判性评估的认知资源减少（批判性思维 ρ=-.20），
  同时情感反应被放大（ρ=.57），进而改变态度（ρ=.44）与意向（ρ=.31）。
  关键洞察：叙事的因果杠杆是"传输"这个中介变量，不是"讲了故事"这个形式。
primary_sources: [SRC-VANLAER-2014]
supporting_evidence:
  - "叙事者侧前因全部显著：可识别角色 ρ=.20 (z=4.15)、可想象情节 ρ=.29 (z=7.39)、逼真性 ρ=.27 (z=4.34)，均 p<.001"
  - "接收者侧前因：熟悉度 ρ=.21、注意 ρ=.29、可传输性 ρ=.30、教育 ρ=.10、女性 ρ=.15，均 p<.001"
  - "后果全显著且方向一致：情感 ρ=.57（大）、态度 ρ=.44（中）、意向 ρ=.31（中）、信念 ρ=.26、叙事思维 ρ=.20、批判性思维 ρ=-.20 (p<.01)"
  - "发表偏倚稳健：file drawer N 80–6627 才能将显著性降至 .05"
conflicting_evidence:
  - "年龄无效应（ρ=.00, p=.496）——但 43.44% 原始研究未报告年龄，32.79% 样本平均 18-22 岁，该零结果效度有限"
  - "测量量表调节显著（Q=10.25, p<.01）：非 Green & Brock 传输量表的研究效应量虚高（ρ=.56 vs .34），含共同方法偏差"
  - "批判性思维效应显著性弱于其他后果变量（z=2.60 vs 9.33–12.16）"
experimental_context: >
  元分析：76 篇已发表与未发表文献、132 个效应量，跨营销/心理学/传播学/消费者/文学研究。
  逆方差加权相关 + 信度校正（ρ）；Q 统计检验异质性；file drawer N 评估发表偏倚。
  情境以消费者叙事为主，含健康传播等邻近领域。
boundary_conditions:
  - "元分析为相关性聚合，非因果结构模型验证——'传输→态度'的链条各环节分别来自不同研究子集"
  - "个人相关性高的故事中，受众可能反而更仔细评估并产生批判思维（Slater & Rouner 2002 机制）"
  - "效应量按 Cohen 标准多为中小（.10–.30），情感反应为大（.57）——叙事改变感受容易、改变行为意向难"
  - "可传输性（人格特质）是中效应前因——同一叙事对不同受众的传输深度差异大"
effect_strength: >
  前因效应小至中（ρ=.10–.30）；后果：情感大（.57）、态度/意向中（.44/.31）、
  批判性思维小负（-.20）。发表偏倚稳健。元分析级证据，置信度 medium-high。
common_misinterpretation:
  - "'演示要有故事'——错：没有传输的故事是装饰；三旋钮（角色/情节/逼真性）才是可操作的"
  - "'故事适合所有场景'——传输降低批判性思维，在需要受众仔细审查的决策场景是负资产"
  - "'数据 vs 故事二选一'——本元分析不比较叙事与统计证据；两者服务不同认知任务"
presentation_application: >
  叙事型演示（愿景/转型/案例/路演）开场前先评估：受众对题材熟悉度低→先建背景再叙事；
  三旋钮设计：角色=受众可代入的具体人（非"某公司"），情节=可在脑中成像的动作序列，
  逼真性=细节真实度（具体数字/时间/地点）；决策/审计场景明确不用叙事主导（与本 Skill
  situation-taxonomy 的场景分类互证）；Question-Framing 节点负责'先建立问题意识'，
  叙事负责'让受众进入问题情境'——两者是接力关系。
confidence: high   # 元分析全文验证，效应量逐项核对，发表偏倚稳健；跨操作化推广需谨慎已如实标注
last_reviewed: 2026-09-08
