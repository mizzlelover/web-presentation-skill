# Evidence Package · Segmenting Effect（补丁 §6 强制格式）
# 生成：2026-09-08，基于 SRC-REY-2019 作者自存档全文精读（31 页）
id: EP-SEGMENTING
domain: segmenting
mechanism: >
  三种不可互斥的机制（元分析无法排除任何一种）：
  (1) 设计者把材料切成有意义连贯的片段，外化了组块与结构化（temporal cueing，
  与事件切分理论 Zacks et al. 2007 一致）；
  (2) 分段提供更多加工时间，避免连续快速呈现中工作记忆在关键时点超载
  （transient information effect）；
  (3) 学习者定速允许个体按自身节奏/资源适配，可能激活监控等元认知过程并提升控制感。
  机制分工：保持成绩主要由机制 (1)(2) 驱动；迁移成绩三种机制均有贡献。
primary_sources: [SRC-REY-2019]
supporting_evidence:
  - "总体：保持 d=0.32、迁移 d=0.36、认知负荷 d=0.23（均 p≤.01，随机效应模型，56 研究 88 比较 N=7713）"
  - "系统定速分段四指标全确认：保持 d=0.42 / 迁移 d=0.35 / 负荷 d=0.29 / 时间 d=-0.87"
  - "学习者定速分段：仅迁移显著——'给控制权'主要帮助迁移而非死记"
  - "无发表偏倚（保持/迁移/负荷漏斗图与 Begg 检验均不显著）；学习时间指标有发表偏倚，需谨慎"
conflicting_evidence:
  - "高先验知识者在保持上获益更多（方向与 expertise-reversal 直感相反；原文解释为高知识者有余裕资源利用分段进行自我调控）"
  - "重复机会、顺序操纵均无调节作用——'能重看'不能替代'被分段'"
experimental_context: >
  多媒体教学实验（1990–2018），主题以自然科学/机械原理为主（39/88），
  材料平均约 19 分钟、平均片段 75 秒；全部组间设计；被试平均 19.7 岁。
boundary_conditions:
  - "片段必须对齐内容的自然事件边界（有意义且连贯），随机等长切分不在证据范围内"
  - "先验知识调节方向反直觉且变异受限（仅 1 项真专家研究），禁止写成'新手更受益'的军规"
  - "分段增加总学习时间（d=-0.92）——演示时间预算必须计入"
  - "证据来自教学多媒体材料；现场演讲中'分段'=幕间停顿+章节化，属类比应用"
effect_strength: "保持/迁移为中小效应（d=0.32–0.42，按原文采用的 Hattie 标准：0.20 小 / 0.40 中）；异质性高，存在调节"
common_misinterpretation:
  - "'分段=把 PPT 页数变多'——分段是按意义边界组织+节奏控制，不是简单分页"
  - "'学习者自控一定更好'——学习者定速仅在迁移上显著，系统定速分段反而四指标全确认"
  - "'能回放就够了'——重复机会无调节作用，不能替代结构化分段"
presentation_application: >
  幕（Scene）划分必须对齐论证的自然事件边界，每幕一个 Cognitive Job 即是分段原则的应用；
  演讲者在幕间主动停顿（system-paced segmentation 的演示等价物）有证据支持；
  交互模式下给受众幕级导航/重看控制权，预期主要促进迁移与理解而非事实记忆；
  负荷曲线设计（禁止连续 HIGH）与分段降负荷证据（d=0.23–0.29）方向一致。
confidence: high
last_reviewed: 2026-09-08
