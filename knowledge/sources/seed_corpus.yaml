  # ── 补丁执行后真实获取并验证的来源（2026-09-08）──
  - source_id: SRC-SWELLER-2019
    title: "Cognitive Architecture and Instructional Design: 20 Years Later"
    authors: [John Sweller, Jeroen J. G. van Merriënboer, Fred Paas]
    year: 2019
    source_type: review
    doi: "10.1007/s10648-019-09465-5"
    url: "https://link.springer.com/article/10.1007/s10648-019-09465-5"
    authority: S
    domain: [cognitive_load, working_memory, instructional_design]
    notes: >
      CLT 20 年官方修订综述（开放获取 CC-BY，全文已读）。关键修订：germane load 不再计入总负荷，
      而是把工作记忆资源从外在活动再分配到内在活动；内在负荷=元素交互性×学习者已有知识。
      系统综述七大效应：goal-free / worked example（高专长者效果减弱，expertise reversal 前提）/
      completion / split-attention（Tarmizi & Sweller 1988，含时间维度 Mayer & Anderson 1992）/
      redundancy（Chandler & Sweller 1991）/ modality（Mousavi 1995；Ginns 2005 元分析）/
      variability（Paas & van Merriënboer 1994：低负荷时增加变异有益）。
      理论基础升级为进化教育心理学五大生物学首要原则。引 Sala & Gobet 2017：通用认知技能不可教。
