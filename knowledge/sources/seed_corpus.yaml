  - source_id: SRC-FRANCONERI-2021
    title: "The Science of Visual Data Communication: What Works"
    authors: [Steven L. Franconeri, Lace M. Padilla, Priti Shah, Jeffrey M. Zacks, Jessica Hullman]
    year: 2021
    source_type: review
    doi: "10.1177/15291006211051956"
    url: "https://gwern.net/doc/design/visualization/2021-franconeri.pdf"
    authority: S
    domain: [data_visualization, visual_perception, attention, uncertainty]
    notes: >
      PSPI 权威综述（22(3):110-161，52 页，© The Authors 2021 开放版全文已读）。核心结论：
      视觉系统可在转瞬之间提取整体统计量（均值/极值），但子集间比较是串行的、每秒仅数次——
      因此必须用分组线索/注释/高亮把比较收窄到支撑结论的那一个；现场演示中靠语言与手势引导注意。
      幻觉与误读清单：Y 轴截断夸大差异；圆/方块须映射面积而非直径；折线斜率增大扭曲差异知觉；
      连续数值映射彩虹色相夸大跨界差异；色盲可达性红配蓝优于红配绿。
      不确定性：对非专业受众避免误差线（被误读为数据范围），改用离散结果样例（HOP/分位点图）。
      风险沟通：用绝对率不用相对率、频率（3/10）不用百分比（30%）、同分母图标阵列；
      拟人图标提升低图表素养者的风险记忆。受众定制：图表素养/ numeracy / 领域知识 / 工作记忆容量。
