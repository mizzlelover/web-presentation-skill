      （Paivio 双重编码：视觉证据+口播）、redundancy（避免屏幕文字与口播逐字重复）、
      segmenting、personalization；指出常见做法（短语标题+ bullet 列表照读）违反这些原则。
      (3) 设计细则——句标题不超过两行、左对齐、约 28pt；正文以视觉证据为主。
      非随机实验，机制论证依赖引用文献，属理论性来源。
